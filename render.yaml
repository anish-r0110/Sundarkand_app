services:
  - type: web
    name: sundarkand-seva-team
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ADMIN_EMAIL
        value: admin@sundarkand.org
